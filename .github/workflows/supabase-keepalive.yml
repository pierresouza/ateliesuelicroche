name: Supabase Keep-Alive Ping (Ateliê Sueli Crochê)

on:
  schedule:
    # Executa automaticamente a cada 3 dias às 09:00 UTC para manter o Supabase sempre ativo
    - cron: "0 9 */3 * *"
  workflow_dispatch:

jobs:
  keep-supabase-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST & RPC Keep-Alive
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://vaoxdmdoqtkbbkccmnxh.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SITE_KEEPALIVE_URL: ${{ secrets.SITE_KEEPALIVE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Disparando pulso Keep-Alive para o Supabase..."
          if [ -n "$SUPABASE_KEY" ]; then
            curl -sS -X POST "${SUPABASE_URL}/rest/v1/rpc/ping_keepalive" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_KEY}" \
              -H "Content-Type: application/json" \
              -d '{"ping_source": "github_actions"}' || true
          else
            curl -sS "${SUPABASE_URL}/rest/v1/" || true
          fi

          if [ -n "$SITE_KEEPALIVE_URL" ]; then
            curl -sS -H "Authorization: Bearer ${CRON_SECRET}" "${SITE_KEEPALIVE_URL}" || true
          fi
          echo "Keep-Alive concluído com sucesso."
